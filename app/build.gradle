plugins {
    id 'com.android.application'
}

android {
    namespace 'com.test.qimen'
    compileSdk 37

    defaultConfig {
        applicationId "com.test.qimen"
        minSdk 24
        targetSdk 37
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
